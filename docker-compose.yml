# PCB-CoolSim 开发环境基础设施（PRD NF-027 单机起步）
# 包含：PostgreSQL16+TimescaleDB / Redis7 / Celery worker+beat / MinIO
# 启动：docker-compose up -d
services:
  db:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: coolsim-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coolsim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coolsim-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: coolsim-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery worker / beat 在 backend 代码就绪后取消注释
  # celery-worker:
  #   build: ./backend
  #   command: celery -A config worker -l info
  #   depends_on: [db, redis]
  #   env_file: .env
  # celery-beat:
  #   build: ./backend
  #   command: celery -A config beat -l info
  #   depends_on: [db, redis]
  #   env_file: .env

volumes:
  pgdata:
  redisdata:
  miniodata:
