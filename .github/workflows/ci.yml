name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ─────────────────────────────────────────────────────────────
# 仓库阶段说明（2026-07-14）
# 当前为 SSD 规范文档阶段，仓库仅含 00~10 文档目录，尚无 backend/ frontend/ 代码。
# 代码相关 job（backend-test / frontend-test / integration-test 等）通过
# `if: hashFiles(...)` 判断代码目录是否存在：代码不存在时自动跳过，避免误报失败；
# 待进入代码开发阶段后，这些 job 会因目录出现而自动启用，无需再改本文件。
# 同时已修复：Node 18→24（消除 Node 20 弃用警告）、actions 升级到最新大版本、
# 缓存路径容错（continue-on-error，文件不存在不阻断流水线）。
# ─────────────────────────────────────────────────────────────

jobs:
  # ── 文档质量检查（文档阶段始终执行）──
  docs-lint:
    name: 文档质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Markdown 文件无 CRLF 损坏
        run: |
          set -e
          # 检测双倍空行损坏（连续3个以上换行视为格式异常）
          bad=$(find . -name "*.md" -not -path "./.git/*" -not -path "./node_modules/*" \
                -exec grep -Pl '\n\n\n\n' {} \; 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "⚠️ 发现疑似格式损坏（连续空行过多）的 Markdown 文件："
            echo "$bad"
            echo "请检查是否被插入了多余空行。"
            # 仅警告不失败，避免阻塞
          fi
          echo "✓ Markdown 格式检查完成"

      - name: 检查文档目录结构完整性
        run: |
          set -e
          echo "校验核心文档目录存在..."
          for d in 00-PRD 01-系统级-Spec 02-模块级-Spec 03-接口级-Spec \
                   04-实现级-Spec 05-UI-UX-设计 09-参考文档; do
            if [ ! -d "$d" ]; then
              echo "❌ 缺失核心目录: $d"
              exit 1
            fi
            echo "✓ $d"
          done

      - name: 检查 ADR 完整性
        run: |
          set -e
          adr_dir="09-参考文档/架构决策记录"
          for n in 0001 0002 0003 0004 0005 0006 0007; do
            if ! ls "$adr_dir"/ADR-$n-*.md >/dev/null 2>&1; then
              echo "❌ 缺失 ADR-$n"
              exit 1
            fi
            echo "✓ ADR-$n"
          done

      - name: 检查残留旧表名（应为 0 真实引用）
        run: |
          set -e
          # coefficient_matrix 应已全部改为 RatioCoefficient
          hits=$(grep -rn "coefficient_matrix" --include="*.md" \
                 01-系统级-Spec 02-模块级-Spec 03-接口级-Spec 04-实现级-Spec 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "⚠️ 发现 coefficient_matrix 残留引用（应为 RatioCoefficient）："
            echo "$hits"
          fi
          echo "✓ 旧表名检查完成"

  # ── 后端测试（代码目录存在时才执行）──
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    # 仅当 backend/requirements.txt 存在时执行；纯文档仓库阶段自动跳过
    if: hashFiles('backend/requirements.txt') != ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coolsim_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run linting
        run: |
          cd backend
          black --check .
          isort --check-only .
          flake8 .
          mypy .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coolsim_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  # ── 前端测试（代码目录存在时才执行）──
  frontend-test:
    name: 前端测试
    runs-on: ubuntu-latest
    # 仅当 frontend/package.json 存在时执行；纯文档仓库阶段自动跳过
    if: hashFiles('frontend/package.json') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache npm
        uses: actions/cache@v4
        # 缓存文件缺失时不阻断流水线（continue-on-error）
        continue-on-error: true
        with:
          path: |
            ~/.npm
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint

      - name: Run type check
        run: |
          cd frontend
          npm run type-check

      - name: Run tests
        run: |
          cd frontend
          npm test -- --coverage

      - name: Build
        run: |
          cd frontend
          npm run build

  # ── 集成测试（前后端均存在时才执行）──
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: |
      always() &&
      hashFiles('backend/requirements.txt') != '' &&
      hashFiles('frontend/package.json') != ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coolsim_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coolsim_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest tests/integration/ -v

  # ── 代码质量检查（代码存在时才执行）──
  code-quality:
    name: 代码质量 (SonarCloud)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 安全扫描（代码存在时才执行）──
  security-scan:
    name: 安全扫描 (Snyk)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ── 文档构建（仅当 mkdocs.yml 存在时执行）──
  docs-build:
    name: 文档构建
    runs-on: ubuntu-latest
    if: hashFiles('mkdocs.yml') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install mkdocs-material
      - name: Build documentation
        run: mkdocs build
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: site/

  # ── 部署到 staging（develop 分支 + 代码存在）──
  deploy-staging:
    name: 部署 Staging
    runs-on: ubuntu-latest
    needs: [integration-test, code-quality, security-scan]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo "Deploying to staging environment..."
      - name: Run smoke tests
        run: echo "Running smoke tests..."

  # ── 部署到 production（main 分支 + 代码存在）──
  deploy-production:
    name: 部署 Production
    runs-on: ubuntu-latest
    needs: [integration-test, code-quality, security-scan]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Deploying to production environment..."
      - name: Run production tests
        run: echo "Running production tests..."

  # ── 性能测试（staging 部署后）──
  performance-test:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Run performance tests
        run: echo "Running performance tests..."

  # ── 监控和告警（production 部署后）──
  monitoring:
    name: 监控配置
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      hashFiles('backend/requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Configure monitoring
        run: echo "Configuring monitoring..."
      - name: Setup alerts
        run: echo "Setting up alerts..."
